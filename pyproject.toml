[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-lead-intelligence"
version = "0.1.0"
description = "MCP server that monitors GitHub repos for engineering activity and converts code changes into sales leads"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "PyGithub>=2.1.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.3.0",
    "pytest>=7.0.0",
]

[project.scripts]
github-lead = "main:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
