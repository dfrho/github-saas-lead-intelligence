<svg width="100%" viewBox="0 0 680 440" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GitHub SaaS Lead Intelligence — system architecture</title>
<desc>Five-layer architecture: Claude Code trigger feeds MCP Server and CLI entry points; MCP Server orchestrates five Python services via a bus; services call GitHub API and Anthropic API and write to registry.json and reports/</desc>
