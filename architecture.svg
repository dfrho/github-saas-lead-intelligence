<svg width="100%" viewBox="0 0 860 570" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GitHub SaaS Lead Intelligence — system architecture v2</title>
<desc>Dual-path architecture: left path shows Claude Code triggering the MCP Server; right path shows Browser using Next.js on Vercel, authenticated via Supabase Auth, calling FastAPI on Railway with embedded APScheduler. Both paths share five Python services (github_api, claude_api, registry, dep_analyzer, vendor_map), which call GitHub API and Anthropic API and persist to Supabase Postgres.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── Row 1: Entry points ── -->
<g>
  <rect x="55" y="22" width="220" height="44" rx="8" stroke-width="0.5" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);"/>
  <text x="165" y="44" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-size:14px;font-weight:500;">Claude Code (MCP client)</text>
</g>
<g>
  <rect x="585" y="22" width="220" height="44" rx="8" stroke-width="0.5" style="fill:rgb(68,68,65);stroke:rgb(180,178,169);"/>
  <text x="695" y="44" text-anchor="middle" dominant-baseline="central" style="fill:rgb(211,209,199);font-size:14px;font-weight:500;">Browser (Next.js / Vercel)</text>
</g>

<!-- ── Row 2: Orchestration ── -->
<g>
  <rect x="45" y="115" width="240" height="52" rx="8" stroke-width="0.5" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);"/>
  <text x="165" y="133" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206,203,246);font-size:14px;font-weight:500;">MCP Server</text>
  <text x="165" y="151" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-size:12px;">main.py · tool orchestration</text>
</g>
<g>
  <rect x="575" y="115" width="240" height="52" rx="8" stroke-width="0.5" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);"/>
  <text x="695" y="133" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206,203,246);font-size:14px;font-weight:500;">Next.js / Vercel</text>
  <text x="695" y="151" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-size:12px;">web/ · React frontend</text>
</g>

<!-- ── Row 3: FastAPI (web path only) ── -->
<g>
  <rect x="555" y="215" width="280" height="52" rx="8" stroke-width="0.5" style="fill:rgb(60,52,137);stroke:rgb(175,169,236);"/>
  <text x="695" y="233" text-anchor="middle" dominant-baseline="central" style="fill:rgb(206,203,246);font-size:14px;font-weight:500;">FastAPI / Railway</text>
  <text x="695" y="251" text-anchor="middle" dominant-baseline="central" style="fill:rgb(175,169,236);font-size:12px;">src/api · Supabase Auth · APScheduler</text>
</g>

<!-- ── Vertical arrows: entry → orchestration ── -->
<line x1="165" y1="66" x2="165" y2="115" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="695" y1="66" x2="695" y2="115" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="695" y1="167" x2="695" y2="215" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>

<!-- ── Bus connections: MCP + FastAPI → shared services ── -->
<!-- MCP Server straight down to bus -->
<line x1="165" y1="167" x2="165" y2="315" stroke="rgb(194,192,182)" stroke-width="1"/>
<!-- FastAPI down to bus -->
<line x1="695" y1="267" x2="695" y2="315" stroke="rgb(194,192,182)" stroke-width="1"/>
<!-- Horizontal bus spanning both paths -->
<line x1="165" y1="315" x2="695" y2="315" stroke="rgb(194,192,182)" stroke-width="1"/>
<!-- Drops from bus to each service -->
<line x1="165" y1="315" x2="165" y2="325" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="295" y1="315" x2="295" y2="325" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="425" y1="315" x2="425" y2="325" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="555" y1="315" x2="555" y2="325" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="685" y1="315" x2="685" y2="325" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>

