  <text x="295" y="343" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-size:13px;font-weight:500;">claude_api</text>
  <text x="295" y="361" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:11px;">Claude wrapper</text>
</g>
<g>
  <rect x="361" y="325" width="128" height="52" rx="8" stroke-width="0.5" style="fill:rgb(8,80,65);stroke:rgb(93,202,165);"/>
  <text x="425" y="343" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-size:13px;font-weight:500;">registry</text>
  <text x="425" y="361" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:11px;">JSON · Postgres</text>
</g>
<g>
  <rect x="491" y="325" width="128" height="52" rx="8" stroke-width="0.5" style="fill:rgb(8,80,65);stroke:rgb(93,202,165);"/>
  <text x="555" y="343" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-size:13px;font-weight:500;">dep_analyzer</text>
  <text x="555" y="361" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:11px;">Dep scoring</text>
</g>
<g>
  <rect x="621" y="325" width="128" height="52" rx="8" stroke-width="0.5" style="fill:rgb(8,80,65);stroke:rgb(93,202,165);"/>
  <text x="685" y="343" text-anchor="middle" dominant-baseline="central" style="fill:rgb(159,225,203);font-size:13px;font-weight:500;">vendor_map</text>
  <text x="685" y="361" text-anchor="middle" dominant-baseline="central" style="fill:rgb(93,202,165);font-size:11px;">SaaS lookup</text>
</g>

<!-- ── Service → External connections ── -->
<path d="M165 377 L165 415 L120 415 L120 440" fill="none" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M295 377 L295 415 L325 415 L325 440" fill="none" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>
<path d="M425 377 L425 415 L630 415 L630 440" fill="none" stroke="rgb(194,192,182)" stroke-width="1" marker-end="url(#arrow)"/>

