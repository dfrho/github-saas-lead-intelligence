<svg width="100%" viewBox="0 0 860 640" role="img" xmlns="http://www.w3.org/2000/svg">
<title>GitHub SaaS Lead Intelligence — system architecture v3</title>
<desc>Dual-path architecture: MCP Server and FastAPI/APScheduler both call run_full_analysis(), which fans out to five shared Python services. Browser and FastAPI both connect to Supabase Auth (OAuth round-trip and JWT validation respectively); services persist to Supabase Postgres.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<style>
  .conn { stroke: rgb(194,192,182); }
  .conn-dashed { stroke: rgb(194,192,182); stroke-dasharray: 4 3; }
  .divider-line { stroke: rgba(222,220,209,0.3); }
  .legend-label { fill: rgb(194,192,182); font-size: 12px; }

  @media (prefers-color-scheme: light) {
    .conn { stroke: rgb(60,60,60); }
    .conn-dashed { stroke: rgb(60,60,60); }
    .divider-line { stroke: rgba(60,60,60,0.35); }
    .legend-label { fill: rgb(30,30,30); }
  }
</style>

